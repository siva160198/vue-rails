default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "mailers,default"
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1
    - queues: "maintenance"
      threads: 1
      processes: 1
      polling_interval: 5
    - queues: "imports"
      threads: 1
      processes: 1
      polling_interval: 2
    - queues: "integrations"
      threads: 1
      processes: 1
      polling_interval: 2

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
