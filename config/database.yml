default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  primary:
    <<: *default
    database: vue_rails_development
  queue:
    <<: *default
    database: vue_rails_development_queue
    migrations_paths: db/queue_migrate

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary:
    <<: *default
    database: vue_rails_test
  queue:
    <<: *default
    database: vue_rails_test_queue
    migrations_paths: db/queue_migrate

production:
  primary: &primary_production
    <<: *default
    database: vue_rails_production
    username: vue_rails
    password: <%= ENV["VUE_RAILS_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: vue_rails_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: vue_rails_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: vue_rails_production_cable
    migrations_paths: db/cable_migrate
